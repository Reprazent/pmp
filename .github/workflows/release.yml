name: Release

# semantic-release decides the next version from the conventional commits
# since the last tag. It runs after CI passes on main, creates the tag and a
# draft GitHub release, and the jobs below build and attach the binaries
# before publishing the release.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
      prerelease: ${{ steps.release.outputs.new_release_channel != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: version
    if: ${{ needs.version.outputs.published == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64 }
          # 22.04 keeps the glibc baseline low so the binary runs on older distros.
          - { os: ubuntu-22.04, goos: linux, goarch: amd64 }
          - { os: ubuntu-22.04-arm, goos: linux, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: jdx/mise-action@v5
      - run: mise run test
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/pkg
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/pkg/pmp ./cmd/pmp
          ./dist/pkg/pmp --version
          cp README.md dist/pkg/
          if [ -f LICENSE ]; then cp LICENSE dist/pkg/; fi
          tar -C dist/pkg -czf "dist/pmp_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: pmp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Attach binaries and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  homebrew:
    needs: [version, publish]
    if: ${{ needs.version.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Update formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir /tmp
          mkdir -p Formula
          scripts/render-formula.sh "$VERSION" /tmp/checksums.txt > Formula/pmp.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pmp.rb
          git commit -m "chore(release): update Homebrew formula for ${TAG}"
          git push origin main
